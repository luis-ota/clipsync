name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            container: debian:bookworm
          - name: ubuntu
            container: ubuntu:24.04
          - name: fedora
            container: fedora:40
          - name: arch
            container: archlinux:base
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust and clipboard tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates build-essential pkg-config xclip wl-clipboard
          elif command -v dnf >/dev/null; then
            dnf install -y curl ca-certificates gcc gcc-c++ make pkg-config xclip wl-clipboard
          else
            pacman -Sy --noconfirm curl ca-certificates base-devel xclip wl-clipboard
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup component add rustfmt clippy

      - name: cargo fmt --check
        run: . "$HOME/.cargo/env" && cargo fmt --all -- --check

      - name: cargo clippy
        run: . "$HOME/.cargo/env" && cargo clippy --workspace --all-targets --no-deps

      - name: cargo build
        run: . "$HOME/.cargo/env" && cargo build --workspace --all-targets

      - name: cargo test
        run: . "$HOME/.cargo/env" && cargo test --workspace --no-fail-fast

      - name: Validate deployment configuration
        run: . "$HOME/.cargo/env" && cargo run -p clipsyncd -- validate-config --config deploy/config/relay.toml

      - name: Smoke CLI
        run: . "$HOME/.cargo/env" && cargo run -q -p clipsyncd -- --help && XDG_CONFIG_HOME="$RUNNER_TEMP/clipsync-${{ matrix.name }}" cargo run -q -p clipsyncd -- endpoints list

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, lint and build
        run: ./gradlew test lint assembleDebug

  desktop-clients:
    name: desktop-client-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check official desktop client
        run: cargo check -p clipsync-client
      - name: Test protocol and client build
        run: cargo test -p clipsync-core -p clipsync-client
