name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            container: debian:bookworm
          - name: ubuntu
            container: ubuntu:24.04
          - name: fedora
            container: fedora:40
          - name: arch
            container: archlinux:base
    steps:
      - uses: actions/checkout@v5

      - name: Install clipboard tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates build-essential pkg-config xclip wl-clipboard
          elif command -v dnf >/dev/null; then
            dnf install -y curl ca-certificates gcc gcc-c++ make pkg-config xclip wl-clipboard
          else
            pacman -Sy --noconfirm curl ca-certificates base-devel xclip wl-clipboard
          fi

      - name: Install Rust
        if: matrix.name == 'ubuntu'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup component add rustfmt clippy

      - name: cargo fmt --check
        if: matrix.name == 'ubuntu'
        run: . "$HOME/.cargo/env" && cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.name == 'ubuntu'
        run: . "$HOME/.cargo/env" && cargo clippy --workspace --all-targets --no-deps

      - name: cargo test
        if: matrix.name == 'ubuntu'
        run: . "$HOME/.cargo/env" && cargo test --workspace --no-fail-fast

      - name: Validate deployment configuration
        if: matrix.name == 'ubuntu'
        run: . "$HOME/.cargo/env" && cargo run -p clipsyncd -- validate-config --config deploy/config/relay.toml

      - name: Smoke CLI
        if: matrix.name == 'ubuntu'
        run: . "$HOME/.cargo/env" && cargo run -q -p clipsyncd -- --help && XDG_CONFIG_HOME="$RUNNER_TEMP/clipsync-${{ matrix.name }}" cargo run -q -p clipsyncd -- endpoints list

      - name: Packaging smoke test
        run: chmod +x packaging/*.sh && packaging/smoke-test.sh

      - name: Build release artifacts available on this target
        if: matrix.name == 'ubuntu'
        run: . "$HOME/.cargo/env" && packaging/build-release.sh "$RUNNER_TEMP/clipsync-dist"

      - name: Upload release artifacts
        if: matrix.name == 'ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: clipsync-${{ matrix.name }}
          path: ${{ runner.temp }}/clipsync-dist/*
          if-no-files-found: error

      - name: Smoke test generated package contents and permissions
        if: matrix.name == 'ubuntu'
        run: packaging/smoke-test.sh "$RUNNER_TEMP/clipsync-dist"

      - name: Validate Arch package metadata
        if: matrix.name == 'arch'
        working-directory: packaging
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --printsrcinfo"

      - name: Validate Flatpak manifest when available
        if: matrix.name == 'ubuntu' || matrix.name == 'debian'
        run: |
          if command -v flatpak-builder >/dev/null 2>&1; then
            flatpak-builder --show-manifest packaging/flatpak/org.clipsync.Clipsyncd.yml >/dev/null
          else
            echo 'flatpak-builder unavailable: manifest validation deferred'
          fi

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, lint and build
        run: ./gradlew test lint assembleDebug

  desktop-clients:
    name: desktop-client-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy desktop client
        run: cargo clippy -p clipsync-client --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release -p clipsync-client
      - name: Validate installer projects
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -x deploy/macos/build-pkg.sh
          plutil -lint deploy/macos/Info.plist deploy/macos/com.clipsync.client.plist
      - name: Validate Windows installer project
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [xml](Get-Content deploy/windows/AppxManifest.xml) | Out-Null
          $tokens = $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path deploy/windows/build-msix.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw $errors }
