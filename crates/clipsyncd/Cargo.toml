[package]
name = "clipsyncd"
description = "Desktop daemon for bidirectional clipboard sync between Linux and Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
axum = { workspace = true, features = ["ws"] }
mdns-sd = { workspace = true }
arboard = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
clipsync-core = { path = "../clipsync-core" }
clap = { workspace = true, features = ["derive"] }
directories = { workspace = true }
toml = { workspace = true }
config.workspace = true
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
# Ícone de bandeja (StatusNotifierItem/AppIndicator). `ksni` é puro Rust
# (zbus), sem puxar GTK — adequado a um daemon headless-first.
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
# Notificações freedesktop (libnotify via D-Bus). Feature `z-with-tokio`
# usa zbus puro Rust, sem libdbus-sys, para não exigir libs de sistema no CI.
notify-rust = { version = "4", default-features = false, features = [
    "z-with-tokio",
] }
