[package]
name = "clipsyncd"
description = "Desktop daemon for bidirectional clipboard sync between Linux and Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
axum = { workspace = true, features = ["ws"] }
mdns-sd = { workspace = true }
wl-clipboard-rs = { workspace = true }
arboard = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
clipsync-core = { path = "../clipsync-core" }
clap = { workspace = true, features = ["derive"] }
directories = { workspace = true }
toml = { workspace = true }
config.workspace = true
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }