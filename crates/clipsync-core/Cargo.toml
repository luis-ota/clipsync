[package]
name = "clipsync-core"
description = "Núcleo do clipsync: protocolo, WebSocket, mDNS, clipboard, pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
axum = { workspace = true, features = ["ws"] }
mdns-sd.workspace = true
arboard.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
hex.workspace = true
rand.workspace = true
base64.workspace = true
uuid.workspace = true
chrono.workspace = true
directories.workspace = true
toml.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower = "0.5"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }

[[bench]]
name = "perf"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("x11-fallback"))'] }
